name: Reset Production Admin Password

on:
  workflow_dispatch:
    inputs:
      username:
        description: Immutable admin username
        required: true
        default: anhkhoa
        type: string

concurrency:
  group: production-admin-password-reset
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm admin:reset-password
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_USERNAME: ${{ inputs.username }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_RESET_PASSWORD }}
