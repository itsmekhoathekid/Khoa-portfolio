name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  full-stack-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://portfolio:portfolio@127.0.0.1:5432/portfolio
      DATABASE_DRIVER: postgres-js
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      BETTER_AUTH_URL: http://127.0.0.1:3000
      R2_ENDPOINT: http://127.0.0.1:9000
      R2_ACCESS_KEY_ID: portfolio
      R2_SECRET_ACCESS_KEY: portfolio-secret
      R2_BUCKET: portfolio-media
      R2_FORCE_PATH_STYLE: 'true'
      NEXT_PUBLIC_MEDIA_URL: /media
      ADMIN_USERNAME: anhkhoa
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: portfolio-test-2026
      PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm start
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start private S3-compatible test storage
        run: >-
          docker run -d --name portfolio-minio
          -p 9000:9000
          -e MINIO_ROOT_USER=portfolio
          -e MINIO_ROOT_PASSWORD=portfolio-secret
          minio/minio:RELEASE.2025-09-07T16-13-09Z
          server /data
      - name: Initialize database and storage
        run: |
          pnpm db:migrate
          pnpm test:storage:init
          pnpm content:seed
          pnpm admin:seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:ci
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
